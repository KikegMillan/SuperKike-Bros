<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Nivel 1: Kike Bros (Mobile)</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      background-color: #0d0d0d;
      color: #00ffcc;
      font-family: 'Press Start 2P', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
      overflow: hidden;
    }
    h1 {
      font-size: 14px;
      color: #ff0055;
      text-shadow: 2px 2px #fff;
      margin-bottom: 8px;
      text-align: center;
    }
    #game-container {
      position: relative;
      border: 3px solid #00ffcc;
      box-shadow: 0 0 15px #00ffcc;
      background: #111;
      width: 100%;
      max-width: 360px; /* Formato móvil vertical */
      aspect-ratio: 9 / 16;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    canvas {
      display: block;
      width: 100%;
      height: 78%;
      background: linear-gradient(to bottom, #111 0%, #220033 100%);
    }

    /* Panel de controles táctiles */
    .touch-controls {
      height: 22%;
      background: #000;
      border-top: 2px solid #00ffcc;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
    }
    .d-pad {
      display: flex;
      gap: 10px;
    }
    .btn-touch {
      background: #222;
      border: 2px solid #00ffcc;
      color: #00ffcc;
      font-family: 'Press Start 2P', monospace;
      font-size: 16px;
      width: 55px;
      height: 55px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px #00a887;
    }
    .btn-touch:active {
      transform: translateY(2px);
      box-shadow: 0 2px #00a887;
      background: #00ffcc;
      color: #000;
    }
    .btn-jump {
      background: #ff0055;
      border-color: #fff;
      color: #fff;
      width: 70px;
      height: 55px;
      font-size: 10px;
      box-shadow: 0 4px #aa0038;
    }
    .btn-jump:active {
      box-shadow: 0 2px #aa0038;
      background: #fff;
      color: #ff0055;
    }

    .custom-photo-btn {
      margin-top: 8px;
      font-size: 8px;
      color: #fff;
      background: #ff0055;
      border: 2px solid #fff;
      padding: 6px 10px;
      cursor: pointer;
      font-family: 'Press Start 2P', monospace;
    }

    /* Modal de victoria */
    #victory-screen {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.92);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      z-index: 10;
    }
    #victory-screen h2 {
      color: #ffcc00;
      font-size: 14px;
      margin-bottom: 15px;
      animation: blink 1s infinite;
    }
    #victory-screen p {
      color: #fff;
      font-size: 10px;
      line-height: 1.6;
      margin-bottom: 15px;
    }
    #victory-screen .date-reveal {
      color: #00ffcc;
      font-size: 12px;
      background: #222;
      border: 2px dashed #00ffcc;
      padding: 12px;
      margin: 10px 0;
    }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
</head>
<body>

  <h1>NIVEL 1: KIKE BROS</h1>

  <div id="game-container">
    <canvas id="gameCanvas" width="320" height="420"></canvas>
    
    <!-- Controles Táctiles Móvil -->
    <div class="touch-controls">
      <div class="d-pad">
        <button class="btn-touch" id="btn-left">◄</button>
        <button class="btn-touch" id="btn-right">►</button>
      </div>
      <button class="btn-touch btn-jump" id="btn-jump">SALTAR</button>
    </div>

    <!-- Pantalla de Victoria -->
    <div id="victory-screen">
      <h2>¡NIVEL 1 SUPERADO!</h2>
      <p>Has reunido todas las jarras de cerveza para la fiesta.</p>
      <div class="date-reveal">FECHA DESBLOQUEADA:<br><br><strong>SÁBADO 14 DE NOVIEMBRE</strong></div>
      <p style="font-size: 8px; color: #888; margin-top: 10px;">¡Pasa al Nivel 2 para descubrir la hora!</p>
    </div>
  </div>

  <input type="file" id="photoInput" accept="image/*" style="display:none;" onchange="loadCustomPhoto(event)">
  <button class="custom-photo-btn" onclick="document.getElementById('photoInput').click()">📷 SUBIR FOTO DE KIKE</button>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let gameOver = false;
    let score = 0;
    const targetScore = 3;

    // Foto del personaje
    let playerImg = new Image();
    playerImg.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 30 30"><circle cx="15" cy="15" r="14" fill="%23ff0055"/><circle cx="10" cy="10" r="3" fill="%23fff"/><circle cx="20" cy="10" r="3" fill="%23fff"/><path d="M 8 20 Q 15 26 22 20" stroke="%23fff" stroke-width="2" fill="none"/></svg>';

    function loadCustomPhoto(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) { playerImg.src = evt.target.result; };
        reader.readAsDataURL(file);
      }
    }

    // Jugador
    const player = {
      x: 20, y: 350,
      width: 26, height: 26,
      vx: 0, vy: 0,
      speed: 3, jumpPower: -9,
      gravity: 0.42, grounded: false
    };

    // Estado de controles (Teclado y Táctil)
    const keys = { right: false, left: false };

    function jump() {
      if (player.grounded) {
        player.vy = player.jumpPower;
        player.grounded = false;
      }
    }

    // Eventos Táctiles
    const btnLeft = document.getElementById('btn-left');
    const btnRight = document.getElementById('btn-right');
    const btnJump = document.getElementById('btn-jump');

    const addTouchEvents = (elem, onStart, onEnd) => {
      elem.addEventListener('touchstart', (e) => { e.preventDefault(); onStart(); });
      elem.addEventListener('touchend', (e) => { e.preventDefault(); onEnd(); });
      elem.addEventListener('mousedown', onStart);
      elem.addEventListener('mouseup', onEnd);
    };

    addTouchEvents(btnLeft, () => keys.left = true, () => keys.left = false);
    addTouchEvents(btnRight, () => keys.right = true, () => keys.right = false);
    addTouchEvents(btnJump, () => jump(), () => {});

    // Eventos Teclado (Soporte PC)
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
      if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
      if (e.key === 'ArrowUp' || e.key === ' ' || e.key === 'w') jump();
    });
    document.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
      if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
    });

    // Escenario Vertical (Plataformas)
    const platforms = [
      { x: 0, y: 395, width: 320, height: 25 },   // Suelo base
      { x: 20, y: 320, width: 120, height: 10 },
      { x: 180, y: 250, width: 120, height: 10 },
      { x: 40, y: 180, width: 120, height: 10 },
      { x: 160, y: 110, width: 130, height: 10 }
    ];

    // Cervezas en plataformas superiores
    const beers = [
      { x: 230, y: 220, collected: false },
      { x: 80, y: 150, collected: false },
      { x: 220, y: 80, collected: false }
    ];

    function drawBeer(x, y) {
      ctx.fillStyle = '#ffcc00';
      ctx.fillRect(x, y, 12, 16);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(x, y, 12, 4);
      ctx.strokeStyle = '#ffcc00';
      ctx.strokeRect(x + 12, y + 4, 3, 8);
    }

    function update() {
      if (gameOver) return;

      if (keys.right) player.vx = player.speed;
      else if (keys.left) player.vx = -player.speed;
      else player.vx = 0;

      player.vy += player.gravity;
      player.x += player.vx;
      player.y += player.vy;

      if (player.x < 0) player.x = 0;
      if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

      player.grounded = false;
      platforms.forEach(plat => {
        if (
          player.x < plat.x + plat.width &&
          player.x + player.width > plat.x &&
          player.y + player.height >= plat.y &&
          player.y + player.height <= plat.y + plat.height + player.vy
        ) {
          player.y = plat.y - player.height;
          player.vy = 0;
          player.grounded = true;
        }
      });

      beers.forEach(beer => {
        if (!beer.collected) {
          if (
            player.x < beer.x + 15 &&
            player.x + player.width > beer.x &&
            player.y < beer.y + 16 &&
            player.y + player.height > beer.y
          ) {
            beer.collected = true;
            score++;
            if (score >= targetScore) winGame();
          }
        }
      });
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Plataformas
      ctx.fillStyle = '#00ffcc';
      platforms.forEach(plat => ctx.fillRect(plat.x, plat.y, plat.width, plat.height));

      // Cervezas
      beers.forEach(beer => { if (!beer.collected) drawBeer(beer.x, beer.y); });

      // Personaje
      ctx.drawImage(playerImg, player.x, player.y, player.width, player.height);

      // UI
      ctx.fillStyle = '#ffffff';
      ctx.font = '9px "Press Start 2P"';
      ctx.fillText(`CERVEZAS: ${score}/${targetScore}`, 10, 20);
    }

    function winGame() {
      gameOver = true;
      document.getElementById('victory-screen').style.display = 'flex';
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
